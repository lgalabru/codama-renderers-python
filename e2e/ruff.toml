# Ruff configuration for the generated e2e fixtures and the smoke test.
#
# The generated clients target Python 3.9 (stdlib only). This config is
# discovered automatically both when `renderVisitor` formats freshly
# generated code and when `e2e/test.sh` lints it, so the two always agree.
target-version = "py39"

[lint]
# Keep the intended rules stable when uvx installs a newer Ruff whose defaults
# may change: syntax/import correctness plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]
